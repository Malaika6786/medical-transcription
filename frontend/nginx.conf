# Serves the built Vue SPA and proxies /api to the backend service —
# matches the dev-time Vite proxy behaviour so the frontend code needs no
# environment-specific base URL logic in production. TLS itself is
# terminated one layer further out (see docker-compose.prod.yml's Caddy
# service) — this container only ever speaks plain HTTP on the internal
# Docker network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so Vue Router's history-mode routes work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ambient/dictation use WebSockets — required for the upgrade to work.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
