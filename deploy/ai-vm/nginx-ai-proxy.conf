# Bearer-token auth proxy in front of Ollama (which has no auth of its own).
# Placeholders __TOKEN__ and __PORT__ are filled in by setup.sh.
server {
    listen __PORT__;
    listen [::]:__PORT__;

    # Completions can take a while on long transcripts.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    client_max_body_size 10m;

    location /v1/ {
        if ($http_authorization != "Bearer __TOKEN__") {
            return 401 '{"error":"unauthorized"}';
        }
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Unauthenticated liveness probe (no model data exposed).
    location = /healthz {
        return 200 'ok';
    }

    location / {
        return 404;
    }
}
